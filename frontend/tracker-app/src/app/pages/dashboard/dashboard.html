<div class="container mt-4" style="max-width: 800px;">
  <h2 class="mb-4 text-primary">Мій Дашборд</h2>

  <div class="card shadow-sm mb-4" *ngIf="workouts.length > 0">
    <div class="card-body">
      <h5 class="card-title text-center text-secondary mb-3">Витрачений час (хвилини)</h5>
      <div style="display: block; max-width: 350px; margin: 0 auto;">
        <canvas baseChart
          [type]="'pie'"
          [datasets]="pieChartDatasets"
          [labels]="pieChartLabels"
          [options]="pieChartOptions">
        </canvas>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-4 border-primary">
    <div class="card-body">
      <h5 class="card-title mb-3">Додати нове тренування</h5>
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Вид (напр. Велосипед)" [(ngModel)]="newWorkout.workout_type">
        </div>
        <div class="col-md-3">
          <input type="number" class="form-control" placeholder="Час (хв)" [(ngModel)]="newWorkout.duration">
        </div>
        <div class="col-md-3">
          <input type="number" class="form-control" placeholder="Відстань (км)" [(ngModel)]="newWorkout.distance">
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100" (click)="addWorkout()">Додати</button>
        </div>
      </div>
    </div>
  </div>
</div>
