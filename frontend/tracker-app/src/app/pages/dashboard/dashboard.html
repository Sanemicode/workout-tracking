<div class="dashboard-container">
  <section class="add-section">
    <!-- Змінюємо заголовок залежно від того, чи ми редагуємо, чи створюємо -->
    <h3>{{ editingId ? 'Редагувати активність' : 'Додати активність' }}</h3>
    
    <!-- Викликаємо нову функцію submitForm() -->
    <form (ngSubmit)="submitForm()">
      <div class="input-row">
        <input type="text" [(ngModel)]="workoutType" name="type" placeholder="Вид (напр. Біг)" required>
        <input type="number" [(ngModel)]="duration" name="duration" placeholder="Час (хв)" required>
        <input type="number" [(ngModel)]="distance" name="distance" placeholder="Дистанція (км)" required>
        <!-- Нове поле для вибору дати -->
        <input type="date" [(ngModel)]="workoutDate" name="date" required>
        
        <button type="submit" class="add-btn">
          {{ editingId ? 'Зберегти' : 'Додати' }}
        </button>
        <!-- Кнопка скасування (з'являється тільки при редагуванні) -->
        <button *ngIf="editingId" type="button" class="cancel-btn" (click)="resetForm()">Скасувати</button>
      </div>
    </form>
  </section>

  <section class="list-section">
    <h3>Історія</h3>
    <div class="workout-grid">
      <div class="workout-card" *ngFor="let w of workouts">
        <div class="card-header">
          {{ w.workout_type }}
          <div class="actions">
            <!-- Додали кнопку редагування з олівцем -->
            <button class="edit-btn" (click)="startEdit(w)">✎</button>
            <button class="delete-btn" (click)="deleteWorkout(w.id)">✖</button>
          </div>
        </div>
        <div class="card-stats">
          <!-- Додали вивід дати на картку -->
          <span>📅 {{ w.date }}</span>
          <span>⏱ {{ w.duration }} хв</span>
          <span>📏 {{ w.distance }} км</span>
        </div>
      </div>
    </div>
    
    <div class="empty-state" *ngIf="workouts.length === 0">
      Ви ще не додали жодного тренування. Час розім'ятися!
    </div>
  </section>
</div>
