<div class="auth-container">
  <h2>{{ isLoginMode ? 'Вхід' : 'Реєстрація' }}</h2>
  
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Email</label>
      <!-- [(ngModel)] зв'язує поле з нашими змінними в TypeScript -->
      <input type="email" name="email" [(ngModel)]="email" required>
    </div>

    <div class="form-group">
      <label>Пароль</label>
      <input type="password" name="password" [(ngModel)]="password" required>
    </div>

    <button type="submit">{{ isLoginMode ? 'Увійти' : 'Зареєструватися' }}</button>
  </form>

  <p (click)="toggleMode()" class="toggle-text">
    {{ isLoginMode ? 'Немає акаунту? Зареєструватися' : 'Вже є акаунт? Увійти' }}
  </p>
</div>
