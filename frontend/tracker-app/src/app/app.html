<!-- Навігація показується тільки авторизованим користувачам -->
<nav class="global-nav" *ngIf="authService.isLoggedIn()">
  <div class="nav-brand">🏃‍♂️ WorkoutTracker</div>
  
  <div class="nav-links">
    <a routerLink="/dashboard" routerLinkActive="active">Дашборд</a>
    <a routerLink="/history" routerLinkActive="active">Історія</a>
  </div>

  <button class="nav-logout-btn" (click)="logout()">Вийти</button>
</nav>

<!-- Сюди Angular буде підставляти Дашборд, Історію або Логін -->
<main class="main-content">

</main>
